<title>{{ site.title }}</title>
<meta name="description" content="{{ site.description }}">


  <meta name="author" content="{{ site.author.name }}">

  
<meta property="og:type" content="website">
<meta property="og:locale" content="en_US">
<meta property="og:site_name" content="{{ site.title }}">
<meta property="og:title" content="{{ site.title }}">
<meta property="og:url" content="{{ site.url | default: '/' }}">
<meta property="og:description" content="{{ site.description }}">
<meta property="og:image" content="{{ site.url | default: '/' }}{{ site.logo | default: '/assets/images/logo.png' }}">
<meta property="og:image:alt" content="{{ site.title }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ site.title }}">
<meta name="twitter:description" content="{{ site.description }}">
<meta name="twitter:image" content="{{ site.url | default: '/' }}{{ site.logo | default: '/assets/images/logo.png' }}">

<link rel="canonical" href="{{ site.url | default: '/' }}">



  <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
    "name": "{{ site.author.name }}",
    "url": "{{ site.url | default: '/' }}"
}
</script>




<!-- Load custom site CSS -->
<link rel="stylesheet" href="/assets/css/custom.css">
